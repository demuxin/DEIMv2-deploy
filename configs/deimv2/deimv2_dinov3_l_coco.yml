__include__: [
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# ====== 模型输入尺寸 ======
# 格式 [h, w],改 input_size 即可同步:训练 Resize、验证 Resize、eval_spatial_size、
# collate 多尺度(base_size = input_size;正方形整批同尺寸,矩形按 (h,w) 对随机
# 且长宽比偏差 <=5%;缩放范围由 collate 的 scale_range 控制(默认 0.85x~1.25x、步长 32,null=关闭)。
# 要求:h、w 均为 32 的整数倍(输出网格按 尺寸/32 对齐)。
input_size: &input_size [512, 896]

# Mosaic 拼图中间尺寸 ≈ h 的一半(改 input_size 时按 h/2 手动同步)
mosaic_out_size: &mosaic_out_size 256

# eval/测试固定尺寸:解码器按它缓存 anchor、编码器按它缓存位置编码, 必须与实际输入一致
eval_spatial_size: *input_size

output_dir: ./outputs/deimv2_dinov3_l_coco

DEIM:
  backbone: DINOv3STAs

DINOv3STAs:
  name: dinov3_vits16
  weights_path: ./ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  interaction_indexes: [5,8,11]   # only need the [1/8, 1/16, 1/32]
  finetune: True
  conv_inplane: 32
  hidden_dim: 224

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

## DEIM LR-Scheduler
epoches: 68 # 72 + 2n  # Increase to search for the optimal ema

lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 34    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
no_aug_epoch: 8

## Optimizer
optimizer:
  type: AdamW
  params: 
    -
      # except norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'  
      lr: 0.0000125
    -
      # including norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'    
      lr: 0.0000125
      weight_decay: 0.
    - 
      # including norm/bn/bias except for the self.dinov3
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125


## Dense O2O: Mosaic + Mixup + CopyBlend
train_dataloader: 
  dataset: 
    transforms:
      ops:
        - {type: Mosaic, output_size: *mosaic_out_size, rotation_range: 0, translation_range: [0.1, 0.1], scaling_range: [0.6, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        # - {type: RandomPhotometricDistort, p: 0.5}     # 去掉颜色变换
        # - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        # ↓ 单次重采样:要用 collate 侧 resize 时,注释掉本行并把
        #   下面 collate_fn.resize_in_collate 设为 True;默认保留本行(两次重采样)
        # - {type: Resize, size: *input_size, }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 34, 60]   # list
        ops: ['Mosaic', 'RandomIoUCrop']  # 'RandomZoomOut', 'RandomPhotometricDistort',

  collate_fn:
    base_size: *input_size    # 多尺度中心,自动跟随 input_size(正方形/矩形均可)
    scale_range: [0.85, 1.25]    # 多尺度范围;null=关闭(固定按 base_size 训练)
    mixup_epochs: [4, 34]
    stop_epoch: 60
    copyblend_epochs: [4, 60]
    base_size_repeat: 3
    # 单次重采样开关:True = 不做数据集侧 Resize,由 collate 逐样本 VF.resize(抗锯齿)一次到位。
    # 启用时必须同时注释掉上面 train transforms 里的 Resize op(否则缩放两次)。
    resize_in_collate: True

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: *input_size, }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

## DEIM Loss
DEIMCriterion:
  matcher:
    matcher_change_epoch: 50

checkpoint_freq: 100    # save freq
